name: Daily Newsletter

on:
  schedule:
    # Backup only: the vibe-newsletter-trigger Cloudflare worker starts this on time at 9 AM Central.
    # GitHub's schedule runs late (hours) or not at all at busy times, so this is set later and off the
    # hour; if the worker already sent today's email, the sender skips it (no duplicates).
    - cron: '37 16 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: 'Send email for this date (YYYY-MM-DD). Leave blank for today.'
        required: false

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send newsletter
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ secrets.MAILERLITE_GROUP_ID }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          # Public (also in js/core-utils.js), so not a secret
          VIBE_COUNTER_URL: https://vibe-counter.caseagent72401.workers.dev
        run: node scripts/newsletter/send-newsletter.js

      # GitHub emails the repo owner when a scheduled run fails; this adds a visible annotation.
      - name: Report failure
        if: failure()
        run: echo "::error title=Daily newsletter failed::No email was sent for $(date +'%Y-%m-%d'). Check the log above (missing batch.json entry or MailerLite error)."
