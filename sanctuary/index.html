<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vibe Check Project - Sanctuary</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
    <div id="gateway">
        <h1 class="sacred-title">THE SANCTUARY</h1>
        <p>A living sanctuary of presence and reflection.</p>
        <input type="password" id="passphrase" placeholder="Speak the passphrase...">
        <button id="enter">Enter</button>
        <div id="error-msg"></div>
    </div>

    <div id="relic-modal" style="display: none;">
        <button id="relic-close">&times;</button>
        <h2 id="relic-title"></h2>
        <p id="relic-quote"></p>
    </div>

    <button id="audio-toggle" title="Mute/Unmute"></button>

    <script src="gatekeeper.js"></script>
    <script src="world.js"></script>
    <script src="atmosphere.js"></script>
    <script src="monuments.js"></script>
    <script src="relics.js"></script>
    <script src="audio.js"></script>
</body>
</html>
